<g fill="none" stroke="#8faacb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M187 235h21m-7-6 7 6-7 6m126-6h21m-7-6 7 6-7 6M727 235h151m-7-6 7 6-7 6"/><path d="M293 299v23h267m267-23v23H560v22m-7-7 7 7 7-7"/></g>
<rect x="207" y="360" width="706" height="112" rx="16" fill="#18363f" stroke="#66dbcf"/>
