<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Drawing rebuild review concept</title><desc id="desc">Geometry, approved requirements, and drawing layout stay separate. On rebuild, an exact hole reference updates; a missing or ambiguous reference waits for review.</desc><rect width="1200" height="610" rx="27" fill="#121b29"/><g font-family="system-ui,sans-serif"><text x="52" y="57" fill="#8eeddb" font-size="17" font-weight="700" letter-spacing="2">CAD STUDIO / CONCEPT / NOT IMPLEMENTED</text><text x="52" y="114" fill="#f4f7fb" font-size="41" font-weight="700">Rebuild the drawing. Review the links.</text>
<g fill="#24324a" stroke="#3d536e"><rect x="52" y="156" width="344" height="111" rx="15"/><rect x="428" y="156" width="344" height="111" rx="15"/><rect x="804" y="156" width="344" height="111" rx="15"/></g>
<g fill="#f2f7ff" font-size="22" font-weight="700"><text x="76" y="198">1. CAD geometry</text><text x="452" y="198">2. Approved requirements</text><text x="828" y="198">3. Drawing settings</text></g>
<g fill="#b9c9df" font-size="17"><text x="76" y="234">A hole changes from Ø8 to Ø10</text><text x="452" y="234">Tolerance, material, finish</text><text x="828" y="234">View, visibility, placement</text></g>
<path fill="none" stroke="#87a0bd" stroke-width="2" d="M224 270v24h752v-24m-376 0v62m-6-7 6 7 6-7"/>
<rect x="52" y="348" width="526" height="177" rx="16" fill="#163d3b" stroke="#6adac9"/><rect x="622" y="348" width="526" height="177" rx="16" fill="#4d342c" stroke="#ffc180"/>
<circle cx="102" cy="416" r="23" fill="none" stroke="#95eddb" stroke-width="3"/><circle cx="102" cy="416" r="12" fill="none" stroke="#95eddb" stroke-width="2"/><path d="M654 400h38v34h-38zM665 417h16" fill="none" stroke="#ffc180" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="143" y="409" fill="#e7fff8" font-size="24" font-weight="700">Exact source still exists</text><text x="715" y="409" fill="#fff4e9" font-size="23" font-weight="700">Source missing or ambiguous</text>
<g font-size="18"><text x="143" y="447" fill="#baefe6">Recompute Ø10; retain the draft layout.</text><text x="143" y="478" fill="#baefe6">Show the change for human review.</text><text x="715" y="447" fill="#ffe0bf">Do not reuse Ø8 or move its tolerance.</text><text x="715" y="478" fill="#ffe0bf">Flag the broken link; do not guess.</text></g>
<text x="600" y="570" text-anchor="middle" fill="#a9bad0" font-size="17">The CAD model stays authoritative. SVG is an output, not the source.</text>
</g></svg>